services:
  bootstrap:
    volumes:
      - localghost-tailnet-ca-root:/var/lib/localghost-tailnet-root
      - localghost-tailnet-ca-signer:/var/lib/localghost-tailnet-ca

  traefik:
    command:
      - --api.dashboard=true
      - --api.insecure=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=localghost
      - --providers.plugin.localghostCA.dockerendpoint=unix:///var/run/docker.sock
      - --providers.plugin.localghostCA.network=localghost
      - --providers.plugin.localghostCA.storagepath=/var/lib/localghost-ca
      - --providers.plugin.localghostCA.pollinterval=250ms
      - --providers.plugin.localghostCA.domainsuffix=localhost
      - --providers.plugin.localghostCA.leaflifetime=24h
      - --providers.plugin.localghostCA.renewbefore=6h
      - --providers.plugin.localghostTailnetCA.dockerendpoint=unix:///var/run/docker.sock
      - --providers.plugin.localghostTailnetCA.network=localghost
      - --providers.plugin.localghostTailnetCA.storagepath=/var/lib/localghost-tailnet-ca
      - --providers.plugin.localghostTailnetCA.pollinterval=250ms
      - --providers.plugin.localghostTailnetCA.domainsuffix=${LOCALGHOST_TAILSCALE_SUFFIX:?set LOCALGHOST_TAILSCALE_SUFFIX}
      - --providers.plugin.localghostTailnetCA.leaflifetime=24h
      - --providers.plugin.localghostTailnetCA.renewbefore=6h
      - --experimental.abortonpluginfailure=true
      - --experimental.localplugins.localghostCA.modulename=github.com/SmileyChris/traefik-localghost-ca
      - --experimental.localplugins.localghostTailnetCA.modulename=github.com/SmileyChris/traefik-localghost-tailnet-ca
    volumes:
      - localghost-tailnet-ca-signer:/var/lib/localghost-tailnet-ca

  tailscale-gateway:
    build:
      context: ./tailscale_gateway
      dockerfile: Dockerfile
    image: localghost-tailscale-gateway:${LOCALGHOST_IMAGE_TAG}
    pull_policy: build
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - --suffix=${LOCALGHOST_TAILSCALE_SUFFIX:?LOCALGHOST_TAILSCALE_SUFFIX is required}
      - --hostname=localghost-${LOCALGHOST_TAILSCALE_SUFFIX}
      - --state-dir=/var/lib/localghost-tailscale
      - --root-ca=/var/lib/localghost-root/rootCA.pem
      - --http-target=traefik:80
      - --https-target=traefik:443
    healthcheck:
      # The health listener starts only after the tsnet node is enrolled and
      # every tailnet listener is up, so healthy means reachable, not merely
      # running. The probe is the gateway binary itself: the image is FROM
      # scratch and ships no shell or curl.
      test: [CMD, /localghost-tailscale-gateway, --health-probe]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 90s
    volumes:
      - localghost-tailscale-state:/var/lib/localghost-tailscale
      # The signer volume contains only the exported public root plus the
      # constrained online signer. The offline root volume must never be
      # mounted into this network-facing service.
      - localghost-tailnet-ca-signer:/var/lib/localghost-root:ro
    networks:
      - localghost
    depends_on:
      traefik:
        condition: service_healthy

volumes:
  localghost-tailscale-state:
    name: localghost-tailscale-state-${LOCALGHOST_TAILSCALE_SUFFIX}
  localghost-tailnet-ca-root:
    name: localghost-tailnet-ca-root-v2-${LOCALGHOST_TAILSCALE_SUFFIX}
  localghost-tailnet-ca-signer:
    name: localghost-tailnet-ca-signer-v2-${LOCALGHOST_TAILSCALE_SUFFIX}
